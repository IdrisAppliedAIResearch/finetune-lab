[project]
name = "ftlab"
version = "0.1.0"
description = "Local LoRA/QLoRA fine-tuning lab for Question-Reasoning-Answer triples"
requires-python = ">=3.13,<3.14"

dependencies = [
    # --- core training stack ---
    "torch>=2.9.1,<3",
    "transformers>=5.16,<6",
    "trl>=1.12,<2",
    "peft>=0.20,<0.21",
    "accelerate>=1.14,<2",
    "datasets>=5.0,<6",
    "bitsandbytes>=0.50.2",

    # --- tokenizers / model formats ---
    "sentencepiece>=0.2",
    "protobuf>=4",
    "safetensors>=0.4",

    # --- config, cli, logging ---
    "pydantic>=2.9,<3",
    "pyyaml>=6",
    "rich>=13",
    "tensorboard>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
# Needed only by llama.cpp's convert_hf_to_gguf.py, which ftlab shells out to.
# Its own requirements file pins transformers 4.x and numpy 1.x; the converter
# runs fine against the 5.x/2.x pair this project trains with, and downgrading
# the training environment to satisfy a one-shot script would be the wrong
# trade, so only the package it genuinely imports is installed.
export = [
    "gguf>=0.10",
]

[project.scripts]
ftlab = "ftlab.cli:main"

# ---------------------------------------------------------------------------
# torch must come from PyTorch's CUDA 12.8 index: the default PyPI wheel is
# CPU-only on Windows, and cu128 is the first build line with sm_120 kernels
# for this machine's RTX 5090 (Blackwell).
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftlab"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Two masking tests import fixtures as `tests.conftest`. Without the repo root
# on the path pytest only adds `tests/` itself, so that import fails.
pythonpath = ["."]
addopts = "-q"

# The real synthetic corpus through a 135M model, capped at a few steps.
#
# This is not a model you would use -- 135M cannot hold a 75-contract library.
# It exists to prove the whole path on the actual data: rendering, the
# system prompt, loss masking, sequence lengths, the collator, and checkpoint
# writing. Run it after regenerating the corpus and before starting the 12B job.
#
#   ftlab synth --out data/processed
#   ftlab check-data -c qra-smoke.yaml --samples 1
#   ftlab train      -c qra-smoke.yaml

extends: base.yaml

run:
  name: qra-smoke
  report_to: none

model:
  base: HuggingFaceTB/SmolLM2-135M-Instruct
  gradient_checkpointing: false

lora:
  r: 8
  alpha: 16

data:
  train_path: data/processed/train.jsonl
  eval_path: data/processed/eval.jsonl
  max_seq_len: 2048
  reasoning_format: think_tags
  train_on_reasoning: true
  # Identical to the 12B config: the system prompt is part of what the model is
  # trained to condition on, so the smoke test has to exercise the same string.
  system_prompt: >-
    You are the past performance and teaming knowledge base for Cardinal Ridge
    Public Health Group, a small business public health contractor. You answer
    from the firm's contract history, partner network, and capability record.
    Rank recommendations and give the evidence each one rests on.

train:
  epochs: 1.0
  per_device_batch_size: 1
  grad_accum: 2
  optim: adamw_torch
  logging_steps: 1
  eval_steps: 8
  save_steps: 200
  max_steps: 8

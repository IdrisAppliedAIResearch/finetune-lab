<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="880" height="470" fill="#FBFAF7"/>

  <text x="20" y="30" font-size="15" font-weight="600" fill="#23211E">Did the training help? No.</text>
  <text x="20" y="52" font-size="12.5" fill="#6B6862">The 156 questions where the two firms had never worked together. Dashed line is what pure guessing scores.</text>

  <line x1="40" y1="320" x2="560" y2="320" stroke="#C9C3B7"/>

  <!-- group 1: top pick -->
  <rect x="70"  y="285"   width="48" height="35"    rx="3" fill="#B4AFA7"/>
  <rect x="124" y="287.5" width="48" height="32.5"  rx="3" fill="#C2703D"/>
  <line x1="60" y1="285" x2="182" y2="285" stroke="#8C8578" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- group 2: in top three -->
  <rect x="250" y="203.5" width="48" height="116.5" rx="3" fill="#B4AFA7"/>
  <rect x="304" y="206.4" width="48" height="113.6" rx="3" fill="#C2703D"/>
  <line x1="240" y1="214.4" x2="362" y2="214.4" stroke="#8C8578" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- group 3: in top five -->
  <rect x="430" y="146.9" width="48" height="173.1" rx="3" fill="#B4AFA7"/>
  <rect x="484" y="149.4" width="48" height="170.6" rx="3" fill="#C2703D"/>
  <line x1="420" y1="143.9" x2="542" y2="143.9" stroke="#8C8578" stroke-width="1.5" stroke-dasharray="5 4"/>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="94"  y="277" fill="#8A8580">8.3%</text>
    <text x="148" y="279" fill="#C2703D">7.7%</text>
    <text x="274" y="195" fill="#8A8580">27.6%</text>
    <text x="328" y="198" fill="#C2703D">26.9%</text>
    <text x="454" y="138" fill="#8A8580">41.0%</text>
    <text x="508" y="141" fill="#C2703D">40.4%</text>
  </g>

  <g font-size="13" font-weight="600" text-anchor="middle" fill="#23211E">
    <text x="121" y="344">Top pick correct</text>
    <text x="301" y="344">Right answer in top 3</text>
    <text x="481" y="344">Right answer in top 5</text>
  </g>

  <g font-size="11.5" text-anchor="middle" fill="#6B6862">
    <text x="121" y="362">guessing 8.3%</text>
    <text x="301" y="362">guessing 25.0%</text>
    <text x="481" y="362">guessing 41.7%</text>
  </g>

  <g font-size="12.5" font-weight="600">
    <rect x="40" y="392" width="13" height="13" rx="2" fill="#B4AFA7"/>
    <text x="60" y="403" fill="#23211E">untrained model</text>
    <rect x="185" y="392" width="13" height="13" rx="2" fill="#C2703D"/>
    <text x="205" y="403" fill="#23211E">after 5 hours of training</text>
  </g>

  <!-- right panel -->
  <rect x="600" y="80" width="260" height="300" rx="8" stroke="#DCD6CA" fill="#FFFFFF"/>
  <text x="620" y="110" font-size="13" font-weight="600" fill="#23211E">What actually changed</text>

  <text x="620" y="152" font-size="30" font-weight="700" fill="#23211E">13 <tspan font-size="19" fill="#8A8580">&#8594;</tspan> 12</text>
  <text x="620" y="174" font-size="12.5" fill="#6B6862">questions right, out of 156</text>

  <line x1="620" y1="196" x2="840" y2="196" stroke="#E4DFD4"/>

  <g font-size="12.5" fill="#4A4741">
    <text x="620" y="222">Three questions got better.</text>
    <text x="620" y="241">Four got worse.</text>
    <text x="620" y="268">That is a coin flip, and the</text>
    <text x="620" y="287">statistics agree — there is no</text>
    <text x="620" y="306">measurable difference at all.</text>
  </g>

  <line x1="620" y1="326" x2="840" y2="326" stroke="#E4DFD4"/>
  <text x="620" y="352" font-size="12.5" fill="#6B6862">On 85% of these questions the</text>
  <text x="620" y="368" font-size="12.5" fill="#6B6862">trained model picked identically.</text>

  <text x="20" y="440" font-size="12.5" fill="#6B6862">Nothing else moved either: the overall score went 43.3% to 42.0%, and the easy look-up questions went 57.7% to 56.1%.</text>
  <text x="20" y="458" font-size="12.5" fill="#6B6862">Both are small enough to be noise — and both point very slightly the wrong way.</text>
</svg>

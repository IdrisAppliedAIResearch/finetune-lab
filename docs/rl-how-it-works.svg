<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="880" height="470" fill="#FBFAF7"/>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A9A399"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="600" fill="#23211E">Step 1 — hide something that really happened, and ask the model to find it</text>

  <rect x="15" y="44" width="500" height="150" rx="8" stroke="#DCD6CA" fill="#FFFFFF"/>
  <text x="33" y="70" font-size="13" font-weight="600" fill="#23211E">CGI FEDERAL hired a new subcontractor for Medicare work.</text>
  <text x="33" y="90" font-size="13" font-weight="600" fill="#23211E">Which of these twelve firms was it?</text>
  <g font-size="12" fill="#4A4741">
    <text x="33"  y="118">1. CATAPULT STAFFING</text>
    <text x="193" y="118">5. CISCO SYSTEMS</text>
    <text x="353" y="118">9. SAMTEK</text>
    <text x="33"  y="137">2. ORACLE AMERICA</text>
    <text x="193" y="137">6. IMPETUS TECH</text>
    <text x="353" y="137">10. ORAN</text>
    <text x="33"  y="156">3. SHI INTERNATIONAL</text>
    <text x="193" y="156">7. RESOLVESOFT</text>
    <text x="353" y="156">11. THE ACI GROUP</text>
    <text x="33"  y="175">4. SPERIDIAN</text>
    <text x="193" y="175">8. CARAHSOFT</text>
    <text x="353" y="175">12. HP</text>
  </g>
  <rect x="349" y="125" width="86" height="17" rx="3" fill="#2F7D95" opacity="0.14"/>
  <text x="440" y="137" font-size="11.5" font-weight="600" fill="#2F7D95">the real answer</text>

  <rect x="545" y="44" width="320" height="150" rx="8" stroke="#DCD6CA" fill="#FFFFFF"/>
  <text x="563" y="70" font-size="13" font-weight="600" fill="#23211E">Why this can be scored by a machine</text>
  <g font-size="12.5" fill="#4A4741">
    <text x="563" y="96">Nobody wrote an answer key. Who actually</text>
    <text x="563" y="115">won the work is a matter of public record.</text>
    <text x="563" y="140">So the model can be graded automatically,</text>
    <text x="563" y="159">thousands of times, with no human in the</text>
    <text x="563" y="178">loop. That is what makes training possible.</text>
  </g>

  <line x1="15" y1="216" x2="865" y2="216" stroke="#E4DFD4"/>
  <text x="20" y="246" font-size="14" font-weight="600" fill="#23211E">Step 2 — split the held-out test questions in two, because only one half is interesting</text>

  <g stroke="#DCD6CA" fill="#FFFFFF">
    <rect x="15"  y="264" width="415" height="150" rx="8"/>
    <rect x="450" y="264" width="415" height="150" rx="8"/>
  </g>
  <rect x="15"  y="264" width="415" height="5" rx="2" fill="#B4AFA7"/>
  <rect x="450" y="264" width="415" height="5" rx="2" fill="#2F7D95"/>

  <text x="35"  y="294" font-size="12" font-weight="700" letter-spacing="1" fill="#8A8580">THE EASY HALF</text>
  <text x="470" y="294" font-size="12" font-weight="700" letter-spacing="1" fill="#2F7D95">THE HALF THAT MATTERS</text>

  <text x="35"  y="320" font-size="15" font-weight="600" fill="#23211E">They had worked together before</text>
  <text x="470" y="320" font-size="15" font-weight="600" fill="#23211E">They had never worked together</text>

  <text x="35"  y="344" font-size="19" font-weight="700" fill="#8A8580">378 questions</text>
  <text x="470" y="344" font-size="19" font-weight="700" fill="#2F7D95">156 questions</text>

  <g font-size="12.5" fill="#4A4741">
    <text x="35"  y="372">You can score well here just by noticing</text>
    <text x="35"  y="391">who this company hired last time. That is</text>
    <text x="35"  y="410">looking up, not reasoning.</text>

    <text x="470" y="372">The relationship does not exist yet, so</text>
    <text x="470" y="391">looking up scores zero by construction.</text>
    <text x="470" y="410">To do well here, you have to reason.</text>
  </g>

  <text x="20" y="448" font-size="12.5" fill="#6B6862">872 questions in all; 534 are held back for testing and shown here. Every number is reported for both halves separately — a combined score hides the point.</text>
</svg>

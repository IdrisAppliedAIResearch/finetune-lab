<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="880" height="440" fill="#FBFAF7"/>

  <text x="20" y="30" font-size="15" font-weight="600" fill="#23211E">Did training make the answers better? No.</text>
  <text x="20" y="52" font-size="12.5" fill="#6B6862">51 sealed questions. The dotted line is what pure guessing scores — anything near it is luck, not skill.</text>

  <!-- panel 1 -->
  <text x="40" y="90" font-size="13" font-weight="600" fill="#23211E">Share of picks that were right</text>
  <text x="40" y="108" font-size="12" fill="#6B6862">higher is better</text>
  <line x1="40" y1="320" x2="420" y2="320" stroke="#C9C3B7"/>

  <rect x="95"  y="146" width="70" height="174" rx="3" fill="#2F7D95"/>
  <rect x="205" y="158" width="70" height="162" rx="3" fill="#C2703D"/>
  <rect x="315" y="209" width="70" height="111" rx="3" fill="#B4AFA7"/>

  <line x1="55" y1="186" x2="410" y2="186" stroke="#8C8578" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="412" y="180" font-size="11.5" font-weight="600" fill="#6B6862" text-anchor="end">guessing 0.37</text>

  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="130" y="138" fill="#2F7D95">0.48</text>
    <text x="240" y="150" fill="#C2703D">0.45</text>
    <text x="350" y="201" fill="#8A8580">0.31</text>
  </g>
  <g font-size="12.5" font-weight="600" text-anchor="middle" fill="#23211E">
    <text x="130" y="342">C  stock</text>
    <text x="240" y="342">A  trained</text>
    <text x="350" y="342">B  no notes</text>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#6B6862">
    <text x="130" y="359">+ notes</text>
    <text x="240" y="359">+ notes</text>
    <text x="350" y="359">below guessing</text>
  </g>

  <!-- panel 2 -->
  <text x="480" y="90" font-size="13" font-weight="600" fill="#23211E">Look-alike traps recommended</text>
  <text x="480" y="108" font-size="12" fill="#6B6862">firms that fit on paper but have no track record — lower is better</text>
  <line x1="480" y1="320" x2="860" y2="320" stroke="#C9C3B7"/>

  <rect x="535" y="246" width="70" height="74"  rx="3" fill="#2F7D95"/>
  <rect x="645" y="202" width="70" height="118" rx="3" fill="#C2703D"/>
  <rect x="755" y="132" width="70" height="188" rx="3" fill="#B4AFA7"/>

  <line x1="495" y1="141" x2="850" y2="141" stroke="#8C8578" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="495" y="135" font-size="11.5" font-weight="600" fill="#6B6862">guessing 2.5</text>

  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="570" y="238" fill="#2F7D95">1.0</text>
    <text x="680" y="194" fill="#C2703D">1.6</text>
    <text x="790" y="124" fill="#8A8580">2.6</text>
  </g>
  <g font-size="12.5" font-weight="600" text-anchor="middle" fill="#23211E">
    <text x="570" y="342">C  stock</text>
    <text x="680" y="342">A  trained</text>
    <text x="790" y="342">B  no notes</text>
  </g>

  <line x1="20" y1="386" x2="860" y2="386" stroke="#E4DFD4"/>
  <text x="20" y="410" font-size="12.5" fill="#4A4741">The stock model with a plain keyword search beat the model we spent an hour training. Training it without the</text>
  <text x="20" y="428" font-size="12.5" fill="#4A4741">records left it worse than guessing — so the facts never made it into the model's memory.</text>
</svg>
